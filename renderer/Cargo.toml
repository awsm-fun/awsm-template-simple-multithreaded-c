# The render worker: awsm-renderer on an OffscreenCanvas, driven by the bridge
# block that lives in the app's memory (see ../app/src/runtime/bridge.h).
#
# This is a standalone crate, not a workspace member: it is built with plain
# `cargo build` on stable Rust, then post-processed by the wasm-bindgen CLI
# (see ../taskfile/renderer.yml).
[package]
name = "renderer"
version = "0.1.0"
edition = "2021"
license = "MIT OR Apache-2.0"
publish = false

[lib]
# A cdylib is what wasm-bindgen consumes: one self-contained .wasm.
crate-type = ["cdylib"]

[dependencies]
# ── The renderer and the loader for editor-exported scenes ───────────────────
#   awsm-renderer              the renderer (re-exports its WebGPU layer as
#                              `awsm_renderer::core`)
#   awsm-renderer-scene        the `Scene` type and the `scene.toml` parser
#   awsm-renderer-scene-loader `load_scene_for_player` and the `ParticleDriver`
#                              that runs its emitters; `http` adds the
#                              ready-made asset source that fetches bundle files
awsm-renderer = "0.46.0"
awsm-renderer-scene = "0.46.0"
awsm-renderer-scene-loader = { version = "0.46.0", features = ["http"] }

# ── Settings and stats, shared by every awsm-renderer app ───────────────────
#   awsm-renderer-settings  the anti-aliasing modes (with TAA), applying one,
#                           the GPU probe, and the settings messages
#   awsm-renderer-stats     the stats panel's numbers: frame windows,
#                           smoothing, renderer CPU and GPU timings, the report
# The page side is the kit's JS twins, synced into dom/runtime/kit/.
awsm-renderer-settings = { git = "https://github.com/awsm-fun/awsm-renderer-kit", tag = "v0.1.3", features = ["renderer", "scene"] }
awsm-renderer-stats = { git = "https://github.com/awsm-fun/awsm-renderer-kit", tag = "v0.1.3", features = ["renderer"] }

# glam types cross the renderer's API, so this must be the renderer's version.
glam = "0.32"

# Typed, checked access to bytes copied out of the bridge block.
bytemuck = { version = "1", features = ["derive"] }

# Runs the pipeline warm-up and the scene download side by side.
futures = "0.3"

# Fetches `scene.toml`. Same version the scene loader uses for its assets.
gloo-net = { version = "0.6", default-features = false, features = ["http"] }

# ── wasm-bindgen ─────────────────────────────────────────────────────────────
# No exact pins: Cargo.lock records the versions, and the tasks require a
# `wasm-bindgen` CLI of exactly the locked version. `cargo update` moves these
# four together; afterwards install the CLI that `task setup` names.
wasm-bindgen = "0.2.130"
wasm-bindgen-futures = "0.4.80"
js-sys = "0.3.107"

# ── logging to the browser console ───────────────────────────────────────────
tracing = "0.1"
tracing-subscriber = "0.3"
tracing-web = "0.1"

[dependencies.web-sys]
version = "0.3.107"
features = [
    "console",
    "DedicatedWorkerGlobalScope",
    "OffscreenCanvas",
    "Performance",
    "RequestCache",
]

# `task renderer:dev`, which `task dev` runs on every save. Our own crate
# stays unoptimized so it rebuilds in a couple of seconds; the dependencies
# (awsm-renderer does the real per-frame work) are built once at full
# optimization, otherwise frame times are unusable.
[profile.dev.package."*"]
opt-level = 3

[profile.dev]
# wasm-bindgen drops DWARF sections, and browser stack traces come from the
# wasm name section instead, so generating debug info would only slow linking.
debug = false

# `task renderer:release`. Size-optimized with whole-program LTO: the module is
# several MB and is downloaded on every cold visit.
[profile.release]
opt-level = "s"
lto = true
codegen-units = 1

