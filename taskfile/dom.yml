# The page (dom/): plain files, no build step, copied into dist/ as they are:
#
#   dom/index.html   → dist/index.html    the page shell
#   dom/game.js      → dist/game.js       your game's side of the page
#   dom/runtime/     → dist/runtime/      the runtime: boot, HUD, panels, bridge view
version: '3'

tasks:
  build:
    desc: Copy dom/ into dist/, then dist/dom.stamp (COI=1, which `task build` passes, adds the COOP/COEP service-worker shim)
    dir: '{{.ROOT_DIR}}'
    cmds:
      - mkdir -p dist
      - cp -R dom/. dist/
      # Shim for static hosts that cannot send the COOP/COEP headers
      # (e.g. GitHub Pages): copy it next to the page and swap the marker
      # comment in index.html for its <script> tag. It must run before
      # runtime/main.js, which is why it sits in <head> as a classic script.
      - |
        if [ "{{.COI}}" = "1" ]; then
          cp tools/coi-serviceworker.js dist/
          sed 's|<!-- coi-serviceworker[^>]*-->|<script src="coi-serviceworker.js"></script>|' dom/index.html > dist/index.html
        else
          rm -f dist/coi-serviceworker.js
        fi
      - touch dist/dom.stamp

  check:
    desc: Syntax-check the page's JavaScript (it has no build step, so nothing else would before a browser does)
    dir: '{{.ROOT_DIR}}'
    cmds:
      # As modules: checked as plain scripts, node gives up at the first
      # `import` without looking at the rest of the file.
      - |
        for file in dom/*.js dom/runtime/*.js dom/runtime/kit/*.js; do
          node --input-type=module --check < "$file" || { echo "dom:check: syntax error in $file"; exit 1; }
        done
