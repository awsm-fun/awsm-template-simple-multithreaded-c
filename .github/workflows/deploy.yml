name: Deploy to GitHub Pages

# Builds the release site and publishes dist/ to GitHub Pages on every merge
# to main. Pages cannot send the COOP/COEP headers shared memory needs, so the
# build includes the coi-serviceworker shim, which adds them in the browser.
on:
  push:
    branches: [main]
  workflow_dispatch:

# Pages deploy needs an OIDC token + write access to the Pages environment.
permissions:
  contents: read
  pages: write
  id-token: write

# One deploy at a time; let an in-flight deploy finish rather than cancel it.
concurrency:
  group: pages
  cancel-in-progress: false

env:
  CARGO_TERM_COLOR: always
  BINARYEN_VERSION: "123"

jobs:
  build:
    name: Build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - name: Install Rust (stable)
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: wasm32-unknown-unknown

      - name: Install Emscripten
        uses: mymindstorm/setup-emsdk@v14
        with:
          version: latest

      # A prebuilt binary of the wasm-bindgen CLI, at the version in Cargo.lock:
      # the CLI refuses wasm built against any other.
      - name: Read the wasm-bindgen version
        run: |
          version=$(sed -n '/^name = "wasm-bindgen"$/{n;s/^version = "\(.*\)"$/\1/p;}' renderer/Cargo.lock)
          echo "WASM_BINDGEN_VERSION=$version" >> "$GITHUB_ENV"
      - name: Install wasm-bindgen
        uses: taiki-e/install-action@v2
        with:
          tool: wasm-bindgen-cli@${{ env.WASM_BINDGEN_VERSION }}

      # wasm-opt, from a pinned Binaryen release: the feature flags the tasks
      # pass (taskfile/renderer.yml) need a recent one. Added to PATH after
      # Emscripten so it is found before any older copy.
      - name: Install Binaryen (wasm-opt)
        run: |
          curl -sSfL "https://github.com/WebAssembly/binaryen/releases/download/version_${BINARYEN_VERSION}/binaryen-version_${BINARYEN_VERSION}-x86_64-linux.tar.gz" \
            | tar xz -C "$RUNNER_TEMP"
          echo "$RUNNER_TEMP/binaryen-version_${BINARYEN_VERSION}/bin" >> "$GITHUB_PATH"

      - name: Install Ninja
        run: sudo apt-get update && sudo apt-get install -y ninja-build

      - name: Install Task
        uses: arduino/setup-task@v2
        with:
          version: 3.x
          repo-token: ${{ secrets.GITHUB_TOKEN }}

      - name: Cache cargo
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: renderer
          cache-on-failure: true

      - name: Configure Pages
        uses: actions/configure-pages@v5

      # Every URL in the site is relative, so the same build works under the
      # "/<repo>/" path Pages serves project sites from.
      - name: Build
        run: task build

      # Stop Pages' Jekyll from touching the output.
      - name: Disable Jekyll
        run: touch dist/.nojekyll

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    name: Deploy
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
